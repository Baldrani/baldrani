<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-labelledby="t">
  <title id="t">Maël Mayon, full-stack web developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b3d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E69F7"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E69F7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4E69F7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="240" rx="18"/></clipPath>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="440" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="soft" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="240"><rect width="900" height="240" fill="url(#edge)"/></mask>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out .3s forwards; }
    .fade { opacity: 0; animation: fade 1.2s ease-out 1.6s forwards; }
    .rise { opacity: 0; animation: rise .8s ease-out forwards; }
    .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .5s; }
    .pulse { transform-origin: 866px 54px; opacity: 0; animation: pulse 2.4s ease-out 2.6s infinite; }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0% { opacity: .7; transform: scale(.4); } 100% { opacity: 0; transform: scale(2.4); } }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
      .fade, .rise { animation: none; opacity: 1; }
      .pulse { animation: none; }
      .blink { animation: none; }
    }
  </style>
  <g clip-path="url(#card)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <g stroke="#ffffff" stroke-opacity=".06" mask="url(#soft)">
      <path d="M440 60H900M440 110H900M440 160H900M440 210H900"/>
      <path d="M500 0V240M590 0V240M680 0V240M770 0V240M860 0V240"/>
    </g>
    <g mask="url(#soft)"><path class="fade" fill="url(#area)" d="M440 186C470 186 480 150 510 150S550 168 580 168 620 118 650 118 690 134 720 134 760 84 790 84 836 54 866 54V240H440Z"/></g>
    <path class="draw" pathLength="1" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" d="M440 186C470 186 480 150 510 150S550 168 580 168 620 118 650 118 690 134 720 134 760 84 790 84 836 54 866 54"/>
    <circle class="pulse" cx="866" cy="54" r="9" fill="#5EEAD4"/>
    <circle class="fade" cx="866" cy="54" r="5" fill="#5EEAD4"/>
    <text class="mono rise" x="44" y="72" fill="#8fa0ff" font-size="16">~/baldrani</text>
    <text class="mono rise d2" x="44" y="128" fill="#ffffff" font-size="44" font-weight="700">Maël Mayon</text>
    <text class="mono rise d3" x="44" y="168" fill="#c7cff5" font-size="17">full-stack · AI agents · Paris<tspan class="blink" fill="#5EEAD4"> ▌</tspan></text>
  </g>
</svg>
